services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cinestream
      POSTGRES_USER: cinestream
      POSTGRES_PASSWORD: cinestream
    ports: ["5433:5432"]   # 5433 on your PC, so it never clashes with a locally installed PostgreSQL
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinestream"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]   # 6380 on your PC, so it never clashes with a local Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/cinestream
      DB_USER: cinestream
      DB_PASSWORD: cinestream
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-key-for-production-use}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]

volumes:
  pgdata:
